# ============ 网页版配置 ============
# 和模拟器版的区别：没有 adb / scrcpy / 模拟器，改成驱动一个独立的 Chrome 窗口。
# 换游戏只要改 browser.url 和 game 那几行。

browser:
  # 调试端口。本程序自己起一份 Chrome（独立 profile，不动你平时的浏览器）
  port: 9222
  # 留空 = 自动找 Chrome / Edge
  chrome: ""
  # 独立的用户目录：登录状态存在这里，第二次开就不用再登。
  # 想直接用平时那个 Chrome 的登录态，就点控制台上的「借用登录态」——
  # 它会把那份 profile 的 cookie 拷到这里（拷之前 Chrome 得先关掉，库是独占的）。
  user_data: "chrome-data"
  # 窗口大小，只是给你看的；不影响识别（识别用的是下面的虚拟视口）
  window: "1440x860"
  # 启动后自动最大化。登录/手动点的时候要看得全，最大化最省事；
  # 不想让它占满屏幕就改成 false（那时窗口按上面的 window 尺寸）
  maximize: true
  # 加载完之后自动对齐一次：把舞台收成画布原生尺寸、放大填满黑边、摆到正中。
  # 只做一次，之后只有窗口尺寸变化才重做 —— 过场动画期间不会去动画面。
  # 扳机：优先认「标题画面的 GAME 字样」（game.title_template），
  # 认不到才退回「主页锚点」/「画面静止」；都等不到就按这个秒数兜底。
  settle_timeout: 60
  # 要不要把游戏画面用 CSS 放大到铺满窗口。
  # true  = 黑边少，但画面是放大插值的（略糊）；
  # false = 保持 1280×720 原生大小居中，黑边大但完全不插值。
  fill: true
  # 加载完（认到 GAME 字样）之后要不要**自动**把网页缩放拨到 100%（默认开）。
  # 这一步必须发真实的键盘事件（Ctrl+= 再 Ctrl+0）：浏览器缩放是浏览器进程的
  # 快捷键，CDP 的合成事件够不着。代价是会抢一下前台焦点，那 1~2 秒不能操作
  # 别的窗口。默认每次连接后自动执行一次（_zoom_done 保证只做一次，失败只警告
  # 不重试，不会反复抢焦点）；不想自动做就改成 false，再点面板「缩放 100%」手动执行。
  zoom_auto: true
  # 游戏地址
  url: "https://www.ero-labs.com/cn/cloud_game.html?id=55&connect_type=1&connection_id=38"
  # 模板基准分辨率（不是视口！）。视口现在永远等于窗口，游戏会被摆到窗口正中的
  # 16:9 舞台里，画布位置由程序实时量出来，再按这个基准换算坐标。
  # 换模板集（比如重录一套 1920×1080 的）才需要改这里。
  viewport: "2560x1440"
  # 允许本程序自动拉起浏览器；关了就只能手动开（端口要对上）
  auto_launch: true
  # 可选：懒人登录。不想在工具的窗口里再登一次，就把浏览器里
  # erolabsjwt 这个 cookie 的值粘到这里（F12 → Application → Cookies 里能复制）。
  # 留空 = 手动登录一次（登录状态存在 chrome-data/ 里，以后不用再登）。
  jwt: ""

capture:
  # 画面流（CDP screencast）的帧率上限与画质 —— 这是整个程序最耗 CPU 的一环。
  # Chrome 的合成器会按屏幕刷新全力推帧（实测 94fps × 2560×1440 JPEG），
  # 每帧 200~400KB，光编码 + base64 + 进程间传输就要吃掉几个核；而识别一次决策
  # 本来就要 0.3~1 秒，永远只用「最新一帧」，90fps 完全没有意义。
  # fps: 30    = 约每 3 帧取 1 帧（30fps 对识别毫无影响）
  # fps: 0     = 不限制（旧行为，约 90fps，费 CPU）
  fps: 30
  # 运行时帧率档位：预览开/录制用 fps_high，预览关用 fps_low 省 CPU。
  # Chrome screencast 只有整数隔帧，凑不出 60；high 档走全速推帧+接收端限帧到 60。
  # 面板顶栏的帧率按钮可在 auto/high/low 间切换，选择会写回 ui.fps_mode。
  fps_high: 60
  fps_low: 20
  # JPEG 质量。62 → 55 大约再省 15% 体积，肉眼看不出区别
  quality: 55

template:
  dir: "assets/templates"
  ref_width: 2560
  ref_height: 1440
  threshold: 0.85
  # 先用模板记录的原位置做局部搜索，命中就走；没命中才全图找。
  # 这是网页版最大的性能优化：单次识别从 3.7MP 扫描降到 0.2MP。
  roi: true
  roi_margin: 180

input:
  # 点击坐标的随机偏移（模板基准像素）
  tap_jitter: 3
  # 每个动作后的随机等待（秒）。
  # 云游戏网页版的点击是「发过去就算」，但界面弹窗/翻页有自己的动画：
  # 动画那零点几秒里点的下一下会被游戏吞掉（表现为「关闭点了没关」「筛选点了没勾上」）。
  # 实测 0.35~0.85 偏快，调到 0.55~1.10；连点密集的录制脚本另有额外缓冲。
  delay_min: 0.55
  delay_max: 1.10

game:
  name: "双穹幻想 Burst"
  # 主页锚点：必须「只在主页出现」
  home_template: "btn_tokuten"
  # 标题画面锚点（GAME 字样那块 logo）：认到它就立刻对齐。
  # 这就是「加载完成、GAME 字样出来」的那一刻，比等画面静止准得多。
  title_template: "title_logo"
  # 回主页时优先点的底部标签
  home_tab: "tab_home"
  # 网页版没有安卓返回键，back() 的最后一招是点这个坐标（左上角返回箭头位置）
  back_point: [70, 70]

bot:
  poll_interval: 0.30
  default_timeout: 15
  save_on_fail: true

ui:
  port: 8765
  # 面板形态。
  #   overlay: true  = 面板作为浮层注入游戏窗口（实测不好用，已关掉）
  #   panel:   true  = 独立弹一个 1280×860 的助手窗口（默认用这个）
  # 两个都开的话：先按浮层走，装不上再补一个独立窗口。
  overlay: false
  panel: true
  # 界面预览图宽度。只影响显示，不影响识别（识别用虚拟视口的原始帧）
  preview_width: 1024
  # 是否默认打开画面预览。false = 省资源：游戏就在浏览器窗口里，看那个就行。
  # 界面上随时能点「画面」开回来；录制任务时会自动打开。
  preview: false
  # 帧率模式：auto=跟随预览开关（开→60/关→20），high=锁60，low=锁省电20。
  # 顶栏帧率按钮点击循环切换，这里会被自动改写以记住上次选择。
  fps_mode: auto

# 自动更新：启动后隔一段时间去 GitHub 查一次最新 Release，
# 有新版就在面板顶栏的版本号上提示，点一下就能下载换包、自动重启。
update:
  # 关掉就完全不联网检查（内网/不想让它请求 GitHub 时改成 false）
  check: true
  # 仓库地址 owner/name。fork 或改名后改这里
  repo: "MrSmida-ux/KyHelper_Web"
  # 每隔多少小时查一次（只在程序开着的时候查）
  interval_hours: 6

logging:
  level: "INFO"
  dir: "logs"
